<!DOCTYPE html>
<html lang="de" data-voice-standalone="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <meta name="description" content="Hands-free voice control for Home Assistant">
  <title>Voice Assist</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
</head>
<body>
  <div id="voiceMount"></div>
  <script src="./ui.js"></script>
  <script>document.getElementById("voiceMount").innerHTML = globalThis.HAVoiceMarkup;</script>
  <script src="./audio.js"></script>
  <script src="./ha-ws.js"></script>
  <script src="./main.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.error("Service Worker registration failed", error);
        });
      });
    }
  </script>
</body>
</html>
