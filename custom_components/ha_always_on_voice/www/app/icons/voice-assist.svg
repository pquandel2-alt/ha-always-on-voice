<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">HA Voice Control</title>
  <desc id="desc">A turquoise voice waveform inside a softly illuminated orb</desc>
  <defs>
    <linearGradient id="background" x1="76" y1="58" x2="438" y2="458" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18243d"/>
      <stop offset="1" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="ring" x1="128" y1="116" x2="394" y2="403" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72f1d4"/>
      <stop offset="0.55" stop-color="#26d5bd"/>
      <stop offset="1" stop-color="#55bde9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect x="28" y="28" width="456" height="456" rx="132" fill="url(#background)"/>
  <circle cx="256" cy="256" r="144" fill="none" stroke="#36dac2" stroke-width="24" opacity="0.2" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="140" fill="#0d1727" stroke="url(#ring)" stroke-width="18"/>
  <path d="M167 266c24 0 24-40 48-40s24 76 48 76 24-112 48-112 24 76 48 76" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="167" cy="266" r="11" fill="#72f1d4"/>
  <circle cx="359" cy="266" r="11" fill="#55bde9"/>
</svg>
